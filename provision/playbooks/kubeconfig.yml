---
# Fetch the cluster kubeconfig to the workstation, pointed at the node's
# Tailscale name. The result is a credential: it stays out of git, is written
# 0600, and is never logged.
- name: Fetch kubeconfig
  hosts: homeserver
  vars:
    kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/homeserver.yaml"
    kubeconfig_name: homeserver
  tasks:
    - name: Read kubeconfig from the node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_remote
      no_log: true

    - name: Create the local kube directory
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ kubeconfig_dest | dirname }}"
        state: directory
        mode: "0700"

    - name: Write kubeconfig pointed at the Tailscale name
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ kubeconfig_dest }}"
        mode: "0600"
        content: >-
          {{ kubeconfig_remote.content | b64decode
             | regex_replace('https://127\.0\.0\.1:6443', 'https://' ~ k3s_api_host ~ ':6443')
             | regex_replace('(?m)^(\s*(?:- )?(?:name|cluster|user|current-context):\s*)default$',
                             '\1' ~ kubeconfig_name) }}
      no_log: true
      diff: false
