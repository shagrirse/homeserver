# Shape of the encrypted secrets file. Create the real one with:
#   sops provision/secrets.sops.yaml
# and paste these keys with real values. It is encrypted for the age key in
# .sops.yaml and is safe to commit. See docs/runbooks/provision-node.md.
tailscale_auth_key: tskey-auth-REPLACE_ME
# Cluster age key Flux decrypts with; generate it as in docs/runbooks/secrets.md.
flux_age_key: AGE-SECRET-KEY-REPLACE_ME
# Read-only GitHub deploy key Flux pulls with; generate it as in docs/runbooks/secrets.md.
flux_deploy_key: REPLACE_ME
