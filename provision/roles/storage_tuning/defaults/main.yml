---
# Reduce disk writes and keep TRIM working. Root is mounted by label, never by a
# device path, so the same config works after moving to an SSD.
storage_tuning_root_source: "LABEL=writable"
storage_tuning_root_fstype: ext4
storage_tuning_zram_size: "ram / 2"
storage_tuning_journal_max_use: 64M
# USB SSD enclosures whose bridge passes TRIM through, as vendor and product
# IDs from lsusb. The kernel leaves TRIM off for USB disks; a udev rule turns
# it on for these. See docs/adr/0006-usb-nvme-boot-disk.md.
storage_tuning_trim_usb_bridges:
  - vendor: "0bda"
    product: "9210"   # Realtek RTL9210
