---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Resolve the hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

# cloud-init sets the hostname on first boot and never manages /etc/hosts
# (see the example user-data). This drop-in makes Ansible the only owner of
# both, so no reboot reverts them.
- name: Stop cloud-init managing the hostname
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-ansible-hostname.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      preserve_hostname: true
      manage_etc_hosts: false

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# On first boot cloud-init and apt-daily can hold the dpkg lock for minutes.
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
    lock_timeout: 600

- name: Check whether an upgrade needs a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required
  changed_when: base_reboot_required.stat.exists
  notify: Reboot node

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# k3s ServiceLB publishes a Service port as a hostPort that matches every
# address on the node, loopback included. A cluster DNS Service on port 53
# would therefore capture the systemd-resolved stub on 127.0.0.53. With the
# stub off, the node resolves through its upstream servers directly, so its
# own lookups, image pulls and CoreDNS's upstream never depend on a cluster
# Service.
- name: Create the resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Turn off the systemd-resolved stub listener
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/10-no-stub.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Resolve]
      DNSStubListener=no
  notify: Restart systemd-resolved

- name: Point resolv.conf at the upstream servers
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: true
