---
# The keyring in /usr/share/keyrings belongs to the tailscale-archive-keyring
# package and stays; the deb822 source below pins its own key.
- name: Remove the legacy one-line Tailscale source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_repo_base }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "{{ tailscale_repo_base }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present

# A dry run neither writes the repository above nor refreshes the cache, so
# on a fresh node the package is unknown. A real run still fails on any error.
- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

- name: Read Tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse Tailscale state
  ansible.builtin.set_fact:
    tailscale_state: "{{ tailscale_status.stdout | default('{}', true) | from_json }}"

- name: Join the tailnet
  when: tailscale_state.BackendState | default('') != 'Running'
  block:
    - name: Require an auth key
      ansible.builtin.assert:
        that: tailscale_auth_key is defined
        fail_msg: >-
          tailscale_auth_key is missing. Add it to provision/secrets.sops.yaml,
          see docs/runbooks/provision-node.md.

    # The key goes through a root-only file on tmpfs so it never shows up in
    # the process list.
    - name: Stage the auth key
      ansible.builtin.copy:
        dest: "{{ tailscale_auth_key_path }}"
        content: "{{ tailscale_auth_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Register with Tailscale
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--hostname={{ tailscale_hostname }}"
          - "--auth-key=file:{{ tailscale_auth_key_path }}"
          - --ssh
          - --accept-dns=false
      changed_when: true

  always:
    - name: Remove the staged auth key
      ansible.builtin.file:
        path: "{{ tailscale_auth_key_path }}"
        state: absent

- name: Keep the Tailscale hostname in sync
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--hostname={{ tailscale_hostname }}"
  when:
    - tailscale_state.BackendState | default('') == 'Running'
    - tailscale_state.Self.HostName | default('') != tailscale_hostname
  changed_when: true

- name: Read Tailscale prefs
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  failed_when: false
  check_mode: false

# Tailnet DNS points at a cluster Service. The node's own lookups, image pulls
# and CoreDNS's upstream must not depend on it, so the node keeps resolving
# through its upstream servers. Unlike switching SSH, this keeps connections.
- name: Keep the node off tailnet DNS
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - --accept-dns=false
  when:
    - tailscale_state.BackendState | default('') == 'Running'
    - (tailscale_prefs.stdout | default('{}', true) | from_json).CorpDNS | default(true)
  changed_when: true

# Tailscale SSH lets tailnet devices log in by tailnet identity, with access
# decided by the tailnet policy (docs/adr/0007-tailscale-ssh.md).
- name: Enable Tailscale SSH
  when:
    - tailscale_state.BackendState | default('') == 'Running'
    - not (tailscale_prefs.stdout | default('{}', true) | from_json).RunSSH | default(false)
  block:
    # Switching drops open OpenSSH sessions over the tailnet, Ansible's own
    # included, so the command runs detached instead of waiting for a reply.
    # --accept-risk skips the CLI's warning pause.
    - name: Turn on Tailscale SSH
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --ssh
          - --accept-risk=lose-ssh
      async: 30
      poll: 0
      changed_when: true

# reset_connection ignores conditions, so it runs on every pass; reconnecting
# is cheap.
- name: Reconnect to the node
  ansible.builtin.meta: reset_connection

# The delay gives the detached switch time to land before reconnecting.
- name: Wait for the node to accept connections
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 60

# A dry run on a fresh node has no tailscale binary yet, so this only runs
# for real. Retries cover a switch that is still being applied.
- name: Wait for Tailscale SSH
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs_after
  changed_when: false
  failed_when: false
  until: (tailscale_prefs_after.stdout | default('{}', true) | from_json).RunSSH | default(false)
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: Require Tailscale SSH
  ansible.builtin.assert:
    that: (tailscale_prefs_after.stdout | default('{}', true) | from_json).RunSSH | default(false)
    fail_msg: >-
      Tailscale SSH is off. Check that tailscaled is running and that
      `tailscale set --ssh` works on the node.
  when: not ansible_check_mode
