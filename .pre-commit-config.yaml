# Install once: pre-commit install --install-hooks
# Run everywhere: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: \.sops\.ya?ml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        exclude: \.sops\.ya?ml$

  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files must be encrypted
        language: pygrep
        entry: 'ENC\[AES256_GCM'
        args: [--negate]
        files: .+\.sops\.ya?ml$
      - id: ansible-lint
        name: ansible-lint
        language: system
        entry: bash -c 'cd provision && ansible-lint'
        files: ^provision/
        pass_filenames: false
