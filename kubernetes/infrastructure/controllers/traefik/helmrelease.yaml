apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      registry: docker.io
      repository: traefik
      tag: v3.7.19
      digest: sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    deployment:
      replicas: 1
    # Routing is Gateway API only. The CRD provider stays on for Middleware.
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: false
    # The GatewayClass comes from the chart; the Gateway lives in
    # infrastructure/configs so it can reference the wildcard certificate.
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    log:
      format: json
    accessLog:
      enabled: true
      format: json
    # Prometheus metrics on the chart's default `metrics` entrypoint (pod
    # port 9100), discovered by Alloy through the ServiceMonitor below.
    # Entry point and service labels, plus buckets aligned to the 500 ms
    # latency SLO, are what SLOs 1-3 are measured from.
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addServicesLabels: true
        buckets: 0.05,0.1,0.25,0.5,1,2.5,5,10
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
    # k3s ServiceLB binds 80 and 443 on every node address. Its forwarding
    # bypasses ufw's incoming rules, so the Service itself admits only the
    # Tailscale address range.
    service:
      spec:
        type: LoadBalancer
        loadBalancerSourceRanges:
          - 100.64.0.0/10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
