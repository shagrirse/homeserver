apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  values:
    image:
      registry: docker.io
      repository: grafana/grafana
      # The chart's default distroless variant: no shell, read-only root
      # filesystem.
      tag: 13.3.1-distroless
      # The chart renders `tag@sha256:<sha>`, so the prefix stays off here.
      sha: 54e297ac67e2b72572f926892f4e06074dc4f79f2a56ed9a9ca9a88a46f28733
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # VictoriaLogs ingests the Loki protocol but does not serve its query
    # API, so logs are queried through VictoriaMetrics' own datasource
    # plugin. Grafana downloads the pinned, signed release at pod start.
    plugins:
      - victoriametrics-logs-datasource@0.34.0
    grafana.ini:
      plugins:
        # Grafana 13 otherwise replaces the core datasource plugins shipped in
        # the pinned image (Prometheus included) with their latest release on
        # every start, and downloads app plugins this setup does not use.
        preinstall_auto_update: false
        # Only the Prometheus datasource (metrics) and the VictoriaLogs plugin
        # are used. Every other bundled datasource runs as its own backend
        # process: with all of them loaded, startup stalls under the memory
        # limit and the liveness probe kills the pod.
        disable_plugins: grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,graphite,grafana-azure-monitor-datasource,grafana-testdata-datasource
    # Datasources provisioned from files: the chart mounts this as the
    # datasources.yaml provisioning file. Fixed UIDs let dashboards refer
    # to them.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: victoria-metrics
            uid: victoria-metrics
            type: prometheus
            access: proxy
            url: http://victoria-metrics-victoria-metrics-single-server.observability.svc:8428
            isDefault: true
          - name: victoria-logs
            uid: victoria-logs
            type: victoriametrics-logs-datasource
            access: proxy
            url: http://victoria-logs-victoria-logs-single-server.observability.svc:9428
    # Dashboards live in git (the grafana-dashboards ConfigMap generated in
    # kustomization.yaml). Changes made in the UI are not persisted.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: git
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/git
    dashboardsConfigMaps:
      git: grafana-dashboards
    serviceMonitor:
      enabled: true
      interval: 30s
    # The chart's helm test pod uses an unpinned image and Flux never runs it.
    testFramework:
      enabled: false
    # A slow first start, such as plugin installation on a loaded node, must
    # not trip the liveness probe: it only runs once this probe has passed.
    startupProbe:
      httpGet:
        path: /api/health
        port: grafana
      periodSeconds: 10
      failureThreshold: 60
    # Grafana 13 holds about 200 MiB of heap at rest and 270 MiB while
    # serving dashboards, plus about 180 MiB of page cache for its own
    # binaries and plugins. A limit close to that sum makes the kernel evict
    # the cached code pages and re-read them from disk (major page faults),
    # which stalls every request until the readiness probe fails.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 768Mi
