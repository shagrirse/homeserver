apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
spec:
  interval: 24h
  # The chart moved from grafana/helm-charts, where it is deprecated, to the
  # community-maintained repository.
  url: oci://ghcr.io/grafana-community/helm-charts/grafana
  ref:
    tag: 14.5.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
