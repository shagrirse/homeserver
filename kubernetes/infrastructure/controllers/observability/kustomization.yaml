apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - helmrepository-prometheus-community.yaml
  - ocirepository-alloy.yaml
  - ocirepository-grafana.yaml
  - ocirepository-victoria-metrics.yaml
  - ocirepository-victoria-logs.yaml
  - helmrelease-alloy.yaml
  - helmrelease-victoria-metrics.yaml
  - helmrelease-victoria-logs.yaml
  - helmrelease-kube-state-metrics.yaml
  - helmrelease-grafana.yaml
  - servicemonitor-flux-operator.yaml
  - httproute.yaml
  - secret.sops.yaml
# Dashboards live in git. The name carries no content hash so the Grafana
# HelmRelease can reference it; Grafana re-reads the mounted files itself.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/node.json
      - dashboards/flux.json
      - dashboards/traefik.json
