# One wildcard certificate for every app: one ACME order per renewal, and app
# hostnames stay out of Certificate Transparency logs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
spec:
  secretName: wildcard-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - ${DOMAIN}
    - "*.${DOMAIN}"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
