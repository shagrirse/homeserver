# DNS is the one exposure that bypasses the shared Gateway: it is not HTTP.
# ServiceLB publishes these ports as host ports on the node, and
# loadBalancerSourceRanges restricts them to the tailnet range. See ADR 0016.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 100.64.0.0/10
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: http
      port: 80
      targetPort: http
