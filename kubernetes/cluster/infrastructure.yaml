# Platform layers, applied in order on a fresh node: the upstream CRDs,
# then the controllers that serve them, then the custom resources those
# controllers own.
---
# Upstream Gateway API CRDs at the release Traefik supports. Kept apart from
# any chart so Helm never owns, or silently stops upgrading, them.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.6.3
  ignore: |
    /*
    !/config/crd/standard/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/standard
  prune: false
  wait: true
---
# Upstream Prometheus Operator CRDs so Alloy can discover ServiceMonitor and
# PodMonitor objects. Same reasoning as Gateway API: kept apart from any
# chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/prometheus-operator/prometheus-operator
  ref:
    tag: v0.95.2
  ignore: |
    /*
    !/example/prometheus-operator-crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: prometheus-operator-crds
  path: ./example/prometheus-operator-crd
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
    - name: prometheus-operator-crds
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Manifests may say ${DOMAIN}; the values live encrypted in
  # cluster-settings.sops.yaml, shared with infra-configs.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Manifests say ${DOMAIN}, ${ACME_EMAIL} and ${TUNNEL_ID}; the values live
  # encrypted in cluster-settings.sops.yaml.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-settings
